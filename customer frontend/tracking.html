<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live GPS Tracking - TORQQ</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/tracking.css">
    <link rel="stylesheet" href="css/ui-components.css">
</head>
<body class="tracking-body">

    <div class="tracking-map-container">
        <canvas id="customerMapCanvas" style="width:100%; height:100%; display:block;"></canvas>
        
        <button class="btn-back-overlay" onclick="window.location.href='dashboard.html'" aria-label="Go Back">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
        </button>

        <button id="btn-sos-floating" style="position:absolute; top:20px; right:20px; background:#EF4444; color:#FFF; font-weight:800; font-size:12px; padding:10px 18px; border-radius:30px; box-shadow:0 6px 16px rgba(239,68,68,0.4); border:none; cursor:pointer; z-index:100;">
            🆘 EMERGENCY SOS
        </button>
    </div>

    <div class="tracking-bottom-sheet">
        <div class="sheet-handle"></div>
        
        <div class="tracking-header">
            <div>
                <h3 class="eta-title">Arriving in <span class="text-green" id="liveEtaText">18 mins</span></h3>
                <p class="distance-text" id="liveDistanceText">12.4 km remaining</p>
            </div>
            <div class="vehicle-plate" id="liveVehiclePlate">KA 05 EV 1284</div>
        </div>
        
        <div class="driver-info-card">
            <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?auto=format&fit=crop&q=80&w=250" alt="Driver" style="width:48px; height:48px; border-radius:50%; object-fit:cover;">
            <div class="driver-details">
                <h4 class="driver-name" id="liveDriverName">Rajesh Kumar</h4>
                <p class="driver-rating">⭐ 4.85 • Tata Tigor EV</p>
            </div>
            <div class="driver-actions" style="display:flex; gap:8px;">
                <a href="tel:+919876543210" class="btn-icon btn-call" aria-label="Call Driver" style="display:inline-flex; align-items:center; justify-content:center; width:40px; height:40px; border-radius:50%; background:#16C15D; color:#FFF;">
                    📞
                </a>
                <button class="btn-icon" id="btn-chat-driver" aria-label="Chat Driver" style="width:40px; height:40px; border-radius:50%; background:rgba(59,130,246,0.1); color:#3B82F6; font-size:16px;">
                    💬
                </button>
            </div>
        </div>
        
        <div class="trip-actions" style="display:flex; gap:10px; margin-top:12px;">
            <button class="btn-secondary btn-full" id="btnShareTrip">Share Live Location</button>
            <button class="btn-danger btn-full" id="btnCancelRide">Cancel Ride</button>
        </div>
    </div>

    <script src="js/config/apiBase.js"></script>
    <script src="js/config/environment.js"></script>
    <script src="js/config/constants.js"></script>
    <script src="js/config/api.js"></script>
    <script src="js/config/routes.js"></script>
    <script src="js/mock/mockData.js"></script>
    <script src="js/services/bookingService.js"></script>
    <script src="js/services/driverService.js"></script>
    <script src="js/components/uiComponents.js"></script>
    <script src="js/mapComponent.js"></script>
    <script src="js/tracking.js"></script>
</body>
</html>
