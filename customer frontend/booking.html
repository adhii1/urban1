<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book Pass - Urban Commuto</title>
    
    <!-- Google Fonts: Poppins -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Stylesheets -->
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/booking-redesign.css">
</head>
<body class="dashboard-body">

    <!-- Header with Back Button -->
    <header class="dashboard-header">
        <div class="container dashboard-header-container" style="justify-content: flex-start; gap: 16px;">
            <button class="btn-back" id="globalBackButton" aria-label="Go Back">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <h2 class="user-name" id="bookingPageTitle" style="font-size: 18px;">Book Ride</h2>
        </div>
    </header>

    <!-- Main Container -->
    <main class="dashboard-main container">
        <div id="redesign-root">
            <!-- Dynamically populated by JS component logic -->
        </div>
    </main>

    <!-- Scripts -->
    <script src="js/app.js"></script>
    <script src="js/customerApi.js"></script>
    <script src="js/config/environment.js"></script>
    <script src="js/rideSocket.js"></script>
    <script src="js/services/locationService.js"></script>
    <script src="js/components/booking-components.js"></script>
    <script src="js/booking.js"></script>
</body>
</html>
