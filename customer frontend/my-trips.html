<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Trips Ledger - TORQQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
    <link rel="stylesheet" href="css/ui-components.css">
</head>
<body class="dashboard-body">

    <header class="dashboard-header">
        <div class="container dashboard-header-container" style="justify-content: flex-start; gap: 16px;">
            <a href="dashboard.html" class="btn-back" aria-label="Go to Dashboard">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
            </a>
            <h2 class="user-name" style="font-size: 18px;">My Trips & Booking Ledger</h2>
        </div>
    </header>

    <main class="dashboard-main container">
        <!-- Tabs -->
        <div role="tablist" aria-label="Filter trips" style="display:flex; gap:10px; margin-bottom:20px; border-bottom:1px solid rgba(0,0,0,0.08); padding-bottom:12px; overflow-x:auto;">
            <button role="tab" aria-selected="true" class="trip-tab active" data-tab="all" style="padding:8px 16px; border-radius:20px; background:#16C15D; color:#fff; font-weight:700; font-size:13px; border:none; cursor:pointer; white-space:nowrap;">All Trips</button>
            <button role="tab" aria-selected="false" class="trip-tab" data-tab="upcoming" style="padding:8px 16px; border-radius:20px; background:rgba(0,0,0,0.05); font-weight:600; font-size:13px; border:none; cursor:pointer; white-space:nowrap;">Upcoming</button>
            <button role="tab" aria-selected="false" class="trip-tab" data-tab="completed" style="padding:8px 16px; border-radius:20px; background:rgba(0,0,0,0.05); font-weight:600; font-size:13px; border:none; cursor:pointer; white-space:nowrap;">Completed</button>
            <button role="tab" aria-selected="false" class="trip-tab" data-tab="cancelled" style="padding:8px 16px; border-radius:20px; background:rgba(0,0,0,0.05); font-weight:600; font-size:13px; border:none; cursor:pointer; white-space:nowrap;">Cancelled</button>
        </div>

        <!-- Each upcoming card carries this customer's own boarding code. -->
        <div id="my-trips-table-container" aria-live="polite"></div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
            <span>Home</span>
        </a>
        <a href="my-trips.html" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>
            <span>My Trips</span>
        </a>
        <a href="booking.html" class="nav-item nav-item-primary">
            <div class="nav-fab"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></div>
            <span>Book</span>
        </a>
        <a href="passes.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="7" width="20" height="10" rx="2"/><line x1="12" y1="7" x2="12" y2="17"/><circle cx="12" cy="12" r="1.5"/></svg>
            <span>Passes</span>
        </a>
        <a href="profile.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <span>Profile</span>
        </a>
    </nav>

    <script src="js/config/apiBase.js"></script>
    <script src="js/config/environment.js"></script>
    <script src="js/config/constants.js"></script>
    <script src="js/config/api.js"></script>
    <script src="js/config/routes.js"></script>
    <script src="js/customerApi.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/my-trips.js"></script>
</body>
</html>
