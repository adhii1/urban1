<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Passes - TORQQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-body">
    <header class="dashboard-header">
        <div class="container dashboard-header-container" style="justify-content: center;">
            <h2 class="user-name" style="font-size: 18px;">My Passes</h2>
        </div>
    </header>

    <main class="dashboard-main container">
        <section class="dashboard-section">
            <div class="commute-card card-green" style="padding: 24px;">
                <div class="card-header" style="margin-bottom: 16px;">
                    <div class="icon-wrapper green-icon-wrapper" style="width: 40px; height: 40px;">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect><line x1="8" y1="21" x2="8" y2="17"></line><line x1="16" y1="21" x2="16" y2="17"></line><line x1="2" y1="9" x2="22" y2="9"></line></svg>
                    </div>
                    <div class="card-titles">
                        <h3 style="font-size: 18px; margin-bottom: 0;">Stop-to-Stop Pass</h3>
                        <span>Active until 30 Nov</span>
                    </div>
                </div>
                <div style="background: white; padding: 12px; border-radius: var(--radius-sm); display: flex; justify-content: space-between;">
                    <span style="font-size: 13px; color: var(--clr-text-main);">Rides Left</span>
                    <strong style="color: var(--clr-primary-green);">18/30</strong>
                </div>
            </div>
            
            <button class="btn-primary" style="width: 100%; margin-top: 24px; padding: 16px; border-radius: var(--radius-md);" onclick="window.location.href='booking.html'">Buy New Pass</button>
        </section>
    </main>

    <!-- Bottom Navigation -->
    <nav class="bottom-nav">
        <a href="dashboard.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
            <span>Home</span>
        </a>
        <a href="my-trips.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path><polyline points="9 12 11 14 15 10"></polyline></svg>
            <span>My Trips</span>
        </a>
        <a href="booking.html" class="nav-item nav-item-primary">
            <div class="nav-fab">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            </div>
            <span>Book</span>
        </a>
        <a href="passes.html" class="nav-item active">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="7" width="20" height="10" rx="2" ry="2"></rect><line x1="12" y1="7" x2="12" y2="17"></line><circle cx="12" cy="12" r="1.5"></circle></svg>
            <span>Passes</span>
        </a>
        <a href="profile.html" class="nav-item">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
            <span>Profile</span>
        </a>
    </nav>
    <script src="js/app.js"></script>
</body>
</html>
