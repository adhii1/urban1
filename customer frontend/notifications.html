<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notifications - TORQQ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/dashboard.css">
</head>
<body class="dashboard-body">
    <header class="dashboard-header">
        <div class="container dashboard-header-container" style="justify-content: flex-start; gap: 16px;">
            <button class="btn-back" onclick="window.history.back()" aria-label="Go Back">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>
            <h2 class="user-name" style="font-size: 18px; flex: 1;">Notifications</h2>
            <button class="btn-text" id="btnMarkAllRead" style="color: var(--clr-primary-green); font-size: 13px; font-weight: 600;">Mark Read</button>
        </div>
    </header>

    <main class="dashboard-main container">
        <section class="dashboard-section" id="notificationsContainer">
            <!-- Dynamically populated notifications -->
            <p style="color: var(--clr-text-light); text-align: center; padding: 32px 0;">Loading notifications...</p>
        </section>
    </main>
    <script src="js/config/apiBase.js"></script>
    <script src="js/app.js"></script>
    <script src="js/customerApi.js"></script>
    <script src="js/notifications.js"></script>
</body>
</html>
