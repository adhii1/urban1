<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORQQ - Boarding Passengers</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        .passengers-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
            gap: 20px;
            margin-top: 24px;
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div id="sidebar-placeholder"></div>

        <div class="main-content">
            <div id="navbar-placeholder"></div>

            <div class="flex-between" style="margin-bottom:24px; flex-wrap:wrap; gap:16px;">
                <div>
                    <h1 style="font-size: 24px; font-weight:800; color:var(--text-main);">Passengers Directory</h1>
                    <p style="font-size: 13px; color:var(--text-light); margin-top:2px;">Contact active shift passengers, view seating plans, and file lost item tickets.</p>
                </div>
                
                <div style="display:flex; gap:12px; width:100%; max-width:480px;">
                    <div style="position:relative; flex:2;">
                        <i class="lucide-search" style="position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--text-light); font-size:16px;"></i>
                        <label for="passengersSearchInput" class="sr-only" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;">Search passengers</label>
                        <input type="search" id="passengersSearchInput" placeholder="Search name, number or stop…" class="form-input" style="padding-left:36px; font-size:12px;">
                    </div>
                    <div style="flex:1;">
                        <!-- Filters on boarding state, which the manifest actually
                             reports. The previous gender filter had no backing
                             field on the customer record, so every option but
                             "all" silently emptied the list. -->
                        <label for="passengerFilterSelect" class="sr-only" style="position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap;">Filter passengers</label>
                        <select id="passengerFilterSelect" class="form-input" style="font-size:12px; height: 100%;">
                            <option value="ALL">All passengers</option>
                            <option value="ONBOARD">Currently on board</option>
                            <option value="WAITING">Awaiting pickup</option>
                            <option value="DONE">Completed</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- List output -->
            <div id="passengersListContainer" class="passengers-grid">
                <!-- Loaded dynamically -->
            </div>

            <div id="footer-placeholder"></div>
        </div>
    </div>

    <!-- Modal dialogue backdrop template -->
    <div id="torqqSharedModal" style="position:fixed; top:0; left:0; width:100vw; height:100vh; background-color:rgba(15,23,42,0.6); backdrop-filter:blur(6px); display:none; align-items:center; justify-content:center; z-index:1000; padding:20px; transition:opacity 0.25s ease;">
        <div class="modal-dialog glass-card" style="width:100%; max-width:500px; background:var(--bg-card-solid); border-radius:var(--border-radius-lg); box-shadow:var(--shadow-premium); transform:scale(0.95); transition:transform 0.25s cubic-bezier(0.16, 1, 0.3, 1); overflow:hidden; display:flex; flex-direction:column;">
            <div style="display:flex; justify-content:space-between; align-items:center; padding:20px 24px; border-bottom:1px solid var(--border-color);">
                <h3 id="sharedModalTitle" style="font-size:16px; font-weight:700; color:var(--text-main);">Modal Title</h3>
                <button id="sharedModalCloseBtn" style="background:none; border:none; cursor:pointer; color:var(--text-light); font-size:24px; line-height:1;">&times;</button>
            </div>
            <div id="sharedModalBody" style="padding:24px; overflow-y:auto; max-height:70vh; font-size:14px; color:var(--text-main);"></div>
            <div id="sharedModalFooter" style="display:flex; justify-content:flex-end; gap:12px; padding:16px 24px; border-top:1px solid var(--border-color); background:var(--bg-app);"></div>
        </div>
    </div>

    <script src="../js/apiBase.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/constants.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    
    <script src="../js/api/authApi.js"></script>
    <!-- tripApi supplies the real passenger directory; driverApi the signed-in
         driver's own identity. Neither was loaded here, so this page could only
         ever render placeholder people. -->
    <script src="../js/api/driverApi.js"></script>
    <script src="../js/api/tripApi.js"></script>
    <script src="../js/api/notificationApi.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/passengers.js"></script>

    <script>
        setTimeout(() => lucide.createIcons(), 600);
    </script>
</body>
</html>
