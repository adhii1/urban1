<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORQQ Driver Login</title>
    <!-- Lucide Icons CDN -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Google Fonts -->
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; background:var(--bg-app);">

    <!-- Login card wrapper -->
    <main class="glass-card fade-in-up" style="
        width: 100%;
        max-width: 420px;
        padding: 40px 32px;
        background: var(--bg-card);
    ">
        <!-- Logo -->
        <div style="display:flex; align-items:center; justify-content:center; gap:10px; margin-bottom:32px;">
            <span style="
                background: #16C15D;
                color: #FFFFFF;
                width: 38px;
                height: 38px;
                border-radius: 10px;
                display: flex;
                align-items: center;
                justify-content: center;
                font-weight: 800;
                font-size: 22px;
            ">T</span>
            <h1 style="font-size: 20px; font-weight:700; color:var(--text-main);">TORQQ Driver</h1>
        </div>

        <h2 style="font-size: 16px; font-weight: 600; color: var(--text-light); text-align:center; margin-bottom: 24px;">Sign in to start driving</h2>

        <!-- Login Form -->
        <form id="driverLoginForm">
            <div class="form-group">
                <label for="loginPhone">PHONE NUMBER</label>
                <div style="position:relative;">
                    <span style="position:absolute; left:14px; top:50%; transform:translateY(-50%); font-weight:600; font-size:14px; color:var(--text-light);">+91</span>
                    <input type="tel" id="loginPhone" class="form-input" style="padding-left:48px;" placeholder="98765 43210" required>
                </div>
            </div>

            <div class="form-group" style="margin-bottom:12px;">
                <div class="flex-between" style="margin-bottom:8px;">
                    <label for="loginPassword" style="margin-bottom:0;">PASSWORD</label>
                    <a href="forgot-password.html" style="font-size:12px; font-weight:600; color:var(--color-primary);">Forgot Password?</a>
                </div>
                <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required>
            </div>

            <button type="submit" id="submitLoginBtn" class="btn btn-primary ripple-btn" style="width:100%; margin-top:24px; padding:14px 24px; justify-content:center;">
                Continue with Credentials
            </button>
        </form>

        <div style="margin-top:24px; text-align:center; font-size:13px; color:var(--text-light);">
            Don't have a partner account? <a href="register.html" style="font-weight:700; color:var(--color-primary);">Register Now</a>
        </div>
    </main>

    <!-- Include core dependencies sequentially -->
    <script src="../js/config.js"></script>
    <script src="../js/constants.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    
    <script src="../js/api/authApi.js"></script>
    
    <script>
        // Init Lucide Icons
        lucide.createIcons();

        document.getElementById('driverLoginForm').onsubmit = (e) => {
            e.preventDefault();
            const phone = document.getElementById('loginPhone').value.trim();
            const pwd = document.getElementById('loginPassword').value;

            // Trigger simulated login
            window.AUTH_API.login(phone, pwd)
                .then(res => {
                    window.UTILS.showToast("Login successful! Redirecting to OTP Verification...", "success");
                    // Cache temporary credentials for OTP screen
                    sessionStorage.setItem('otp_phone', phone);
                    setTimeout(() => {
                        window.location.href = 'otp.html';
                    }, 1000);
                })
                .catch(err => {
                    window.UTILS.showToast(err.message, "error");
                });
        };
    </script>
</body>
</html>
