<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORQQ - Document Manager</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <div class="app-wrapper">
        <div id="sidebar-placeholder"></div>

        <div class="main-content">
            <div id="navbar-placeholder"></div>

            <div style="margin-bottom:24px;">
                <h1 style="font-size: 24px; font-weight:800; color:var(--text-main);">Document Verification</h1>
                <p style="font-size: 13px; color:var(--text-light); margin-top:2px;">Audit partner verifications, driving license details, and permit expiries.</p>
            </div>

            <!-- Documents layouts -->
            <div class="dashboard-grid" style="grid-template-columns: 2fr 1fr;">
                
                <!-- Rendered from GET /driver/documents. These three cards used to
                     be hardcoded as "Approved" with sample licence and RC numbers,
                     so every driver appeared fully verified regardless of what
                     they had actually uploaded. -->
                <div id="documentsList" style="display:flex; flex-direction:column; gap:16px;"></div>

                <!-- Right sidebar uploader -->
                <div>
                    <div class="glass-card" style="padding:24px;">
                        <h2 style="font-size: 15px; font-weight:700; color:var(--text-main); margin-bottom:16px;">Upload a document</h2>

                        <div class="form-group">
                            <label for="documentTypeSelect">Document type</label>
                            <select id="documentTypeSelect" class="form-input" style="font-size:13px;">
                                <option value="license">Driving licence</option>
                                <option value="vehicleRC">Vehicle registration certificate</option>
                                <option value="insurance">Vehicle insurance</option>
                            </select>
                        </div>

                        <div class="form-group" id="insuranceExpiryGroup" style="display:none;">
                            <label for="documentExpiryInput">Insurance expiry date</label>
                            <input type="date" id="documentExpiryInput" class="form-input" style="font-size:13px;">
                        </div>

                        <div class="form-group">
                            <label for="documentFileInput">File</label>
                            <input type="file" id="documentFileInput" class="form-input" accept=".jpg,.jpeg,.png,.webp,.pdf" style="font-size:12px;">
                            <div style="font-size:11px; color:var(--text-light); margin-top:6px;">JPG, PNG, WEBP or PDF.</div>
                        </div>

                        <button id="documentUploadBtn" class="btn btn-primary" style="width:100%; justify-content:center;">
                            <i class="lucide-upload-cloud"></i> Upload for verification
                        </button>
                    </div>
                </div>

            </div>

            <div id="footer-placeholder"></div>
        </div>
    </div>

    <script src="../js/apiBase.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/constants.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    
    <script src="../js/api/authApi.js"></script>
    <!-- driverApi resolves the signed-in driver's own identity. Without it the
         sidebar/navbar keep the markup's placeholder name on this page. -->
    <script src="../js/api/driverApi.js"></script>
    <script src="../js/api/notificationApi.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/documents.js"></script>

    <script>
        setTimeout(() => lucide.createIcons(), 600);
    </script>
</body>
</html>
