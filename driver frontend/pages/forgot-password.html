<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORQQ - Forgot Password</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; background:var(--bg-app);">

    <main class="glass-card fade-in-up" style="
        width: 100%;
        max-width: 420px;
        padding: 40px 32px;
        background: var(--bg-card);
    ">
        <h2 style="font-size: 22px; font-weight:700; color:var(--text-main); margin-bottom:8px; text-align:center;">Reset Password</h2>
        <p style="font-size:13px; color:var(--text-light); line-height:1.5; margin-bottom:28px; text-align:center;">
            Enter your registered phone number, and we'll send you instructions to reset your password.
        </p>

        <form id="forgotPasswordForm">
            <div class="form-group">
                <label for="resetPhone">PHONE NUMBER</label>
                <div style="position:relative;">
                    <span style="position:absolute; left:14px; top:50%; transform:translateY(-50%); font-weight:600; font-size:14px; color:var(--text-light);">+91</span>
                    <input type="tel" id="resetPhone" class="form-input" style="padding-left:48px;" placeholder="98765 43210" required>
                </div>
            </div>

            <button type="submit" id="requestResetBtn" class="btn btn-primary ripple-btn" style="width:100%; margin-top:24px; padding:14px; justify-content:center;">
                Send Reset Link
            </button>
        </form>

        <div style="margin-top:24px; text-align:center; font-size:13px;">
            <a href="login.html" style="font-weight:700; color:var(--color-primary); display:flex; align-items:center; justify-content:center; gap:8px;">
                <i class="lucide-arrow-left" style="font-size:16px;"></i> Back to Login
            </a>
        </div>
    </main>

    <script src="../js/apiBase.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/constants.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    
    <script src="../js/api/authApi.js"></script>

    <script>
        lucide.createIcons();

        document.getElementById('forgotPasswordForm').onsubmit = (e) => {
            e.preventDefault();
            const phone = document.getElementById('resetPhone').value.trim();

            window.AUTH_API.forgotPassword(phone)
                .then(res => {
                    window.UTILS.showToast(res.message, "success");
                    setTimeout(() => {
                        window.location.href = 'login.html';
                    }, 2000);
                });
        };
    </script>
</body>
</html>
