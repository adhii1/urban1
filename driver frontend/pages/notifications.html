<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORQQ - Driver Notifications Logs</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <style>
        .filter-tabs-container {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
            overflow-x: auto;
            padding-bottom: 6px;
        }
        .noti-filter-tab {
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 13px;
            font-weight: 600;
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            cursor: pointer;
            color: var(--text-light);
            transition: var(--transition-smooth);
            white-space: nowrap;
        }
        .noti-filter-tab:hover {
            background: var(--bg-hover);
            color: var(--color-primary);
        }
        .noti-filter-tab.active-tab {
            background: var(--color-primary);
            color: #FFFFFF;
            border-color: var(--color-primary);
        }
    </style>
</head>
<body>

    <div class="app-wrapper">
        <div id="sidebar-placeholder"></div>

        <div class="main-content">
            <div id="navbar-placeholder"></div>

            <!-- Page Header -->
            <div class="flex-between" style="margin-bottom:24px; flex-wrap:wrap; gap:16px;">
                <div>
                    <h1 style="font-size: 24px; font-weight:800; color:var(--text-main);">Notifications Center</h1>
                    <p style="font-size: 13px; color:var(--text-light); margin-top:2px;">View active trip assignments, payout messages, document alerts, and support details.</p>
                </div>
                <button id="markAllReadBtn" class="btn btn-secondary" style="font-size:12px; padding:10px 16px;"><i class="lucide-check-check"></i> Mark All as Read</button>
            </div>

            <!-- Filter tabs -->
            <div class="filter-tabs-container">
                <button class="noti-filter-tab active-tab" data-tab="ALL">All Alerts</button>
                <button class="noti-filter-tab" data-tab="UNREAD">Unread Messages</button>
                <button class="noti-filter-tab" data-tab="PROMO">Promotional Deals</button>
                <button class="noti-filter-tab" data-tab="EMERGENCY">Emergency Warnings</button>
            </div>

            <!-- Logs list -->
            <div id="notificationsListWrap" style="max-width: 760px;">
                <!-- Loaded dynamically -->
            </div>

            <div id="footer-placeholder"></div>
        </div>
    </div>

    <script src="../js/apiBase.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/constants.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    
    <script src="../js/api/authApi.js"></script>
    <!-- driverApi resolves the signed-in driver's own identity. Without it the
         sidebar/navbar keep the markup's placeholder name on this page. -->
    <script src="../js/api/driverApi.js"></script>
    <script src="../js/api/notificationApi.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/notifications.js"></script>

    <script>
        setTimeout(() => lucide.createIcons(), 600);
    </script>
</body>
</html>
