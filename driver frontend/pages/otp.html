<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORQQ Driver OTP Verification</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body style="display:flex; align-items:center; justify-content:center; min-height:100vh; padding:20px; background:var(--bg-app);">

    <main class="glass-card fade-in-up" style="
        width: 100%;
        max-width: 420px;
        padding: 40px 32px;
        background: var(--bg-card);
        text-align: center;
    ">
        <!-- Shield Icon -->
        <div style="
            display: inline-flex;
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: var(--bg-hover);
            color: var(--color-primary);
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
        ">
            <i class="lucide-shield-check" style="font-size: 28px;"></i>
        </div>

        <h2 style="font-size: 20px; font-weight:700; color:var(--text-main); margin-bottom:8px;">Enter Verification Code</h2>
        <p style="font-size:13px; color:var(--text-light); line-height:1.5; margin-bottom:24px;">
            We've sent a 6-digit verification code to your registered mobile number <strong id="otpPhoneDisplay">+91 ••••• •••10</strong>
        </p>

        <!-- OTP inputs -->
        <form id="otpForm">
            <div style="display:flex; justify-content:center; gap:12px; margin-bottom:28px;">
                <input type="text" class="form-input otp-digit" maxlength="1" required style="width:44px; height:50px; text-align:center; font-size:20px; font-weight:700;">
                <input type="text" class="form-input otp-digit" maxlength="1" required style="width:44px; height:50px; text-align:center; font-size:20px; font-weight:700;">
                <input type="text" class="form-input otp-digit" maxlength="1" required style="width:44px; height:50px; text-align:center; font-size:20px; font-weight:700;">
                <input type="text" class="form-input otp-digit" maxlength="1" required style="width:44px; height:50px; text-align:center; font-size:20px; font-weight:700;">
                <input type="text" class="form-input otp-digit" maxlength="1" required style="width:44px; height:50px; text-align:center; font-size:20px; font-weight:700;">
                <input type="text" class="form-input otp-digit" maxlength="1" required style="width:44px; height:50px; text-align:center; font-size:20px; font-weight:700;">
            </div>

            <button type="submit" id="verifyOtpBtn" class="btn btn-primary ripple-btn" style="width:100%; padding:14px; justify-content:center;">
                Verify Code
            </button>
        </form>

        <div style="margin-top:24px; font-size:13px; color:var(--text-light);">
            Didn't receive code? <span id="otpCountdownText">Resend in <strong id="otpTimer">59</strong>s</span>
            <button id="resendOtpBtn" style="background:none; border:none; color:var(--color-primary); font-weight:700; cursor:pointer; display:none;">Resend OTP</button>
        </div>
    </main>

    <script src="../js/apiBase.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/constants.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    
    <script src="../js/api/authApi.js"></script>

    <script>
        lucide.createIcons();

        // Display current phone
        const p = sessionStorage.getItem('otp_phone') || "9876543210";
        document.getElementById('otpPhoneDisplay').textContent = "+91 " + p.substring(0, 5) + " " + p.substring(5);

        // Autofocus progression on OTP digits
        const inputs = document.querySelectorAll('.otp-digit');
        inputs.forEach((input, index) => {
            input.oninput = (e) => {
                const val = e.target.value;
                // Move to next if entered
                if (val && index < inputs.length - 1) {
                    inputs[index + 1].focus();
                }
            };
            
            input.onkeydown = (e) => {
                // Move back on backspace
                if (e.key === 'Backspace' && !input.value && index > 0) {
                    inputs[index - 1].focus();
                }
            };
        });

        // Timer countdown
        let count = 59;
        const timerText = document.getElementById('otpTimer');
        const countText = document.getElementById('otpCountdownText');
        const resendBtn = document.getElementById('resendOtpBtn');

        const countdown = setInterval(() => {
            count--;
            if (timerText) timerText.textContent = count;
            
            if (count <= 0) {
                clearInterval(countdown);
                countText.style.display = 'none';
                resendBtn.style.display = 'inline-block';
            }
        }, 1000);

        resendBtn.onclick = () => {
            window.UTILS.showToast("OTP code resent! Please check your inbox.", "info");
            resendBtn.style.display = 'none';
            countText.style.display = 'inline';
            count = 59;
            // restarts count...
        };

        // Submit form
        document.getElementById('otpForm').onsubmit = (e) => {
            e.preventDefault();
            const otpCode = Array.from(inputs).map(i => i.value).join('');

            window.AUTH_API.verifyOTP(p, otpCode)
                .then(res => {
                    window.UTILS.showToast("OTP Verified! Connecting to Dashboard...", "success");
                    setTimeout(() => {
                        window.location.href = 'dashboard.html';
                    }, 1000);
                })
                .catch(err => {
                    window.UTILS.showToast(err.message, "error");
                });
        };
    </script>
</body>
</html>
