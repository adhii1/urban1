<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TORQQ - Driver Route & Telemetry</title>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/dashboard.css">
    <link rel="stylesheet" href="../css/animations.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

    <div class="app-wrapper">
        <div id="sidebar-placeholder"></div>

        <div class="main-content">
            <div id="navbar-placeholder"></div>

            <div style="margin-bottom:24px;">
                <h1 style="font-size: 24px; font-weight:800; color:var(--text-main);">Driver Route Navigation & Live Telemetry</h1>
                <p style="font-size: 13px; color:var(--text-light); margin-top:2px;">Track assigned corridor route stops, driver location, passenger counts, and ETA progress.</p>
            </div>

            <!-- Route Metrics Bar. Every value is filled from the driver's
                 assigned trip by js/routes.js. -->
            <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:16px; margin-bottom:24px;">
                <div class="glass-card" style="padding:16px;">
                    <div style="font-size:10px; font-weight:700; color:var(--text-light); text-transform:uppercase;">Trip</div>
                    <div id="routeTripLabel" style="font-size:14px; font-weight:700; color:var(--text-main); margin-top:4px;">—</div>
                </div>
                <div class="glass-card" style="padding:16px;">
                    <div style="font-size:10px; font-weight:700; color:var(--text-light); text-transform:uppercase;">Passengers on board</div>
                    <div id="routeOnboardCount" style="font-size:16px; font-weight:800; color:#16C15D; margin-top:4px;">—</div>
                </div>
                <div class="glass-card" style="padding:16px;">
                    <div style="font-size:10px; font-weight:700; color:var(--text-light); text-transform:uppercase;">Trip distance</div>
                    <div id="routeDistance" style="font-size:16px; font-weight:800; color:var(--color-primary); margin-top:4px;">—</div>
                </div>
                <div class="glass-card" style="padding:16px;">
                    <div style="font-size:10px; font-weight:700; color:var(--text-light); text-transform:uppercase;">Scheduled departure</div>
                    <div id="routeDeparture" style="font-size:16px; font-weight:800; color:#3B82F6; margin-top:4px;">—</div>
                </div>
            </div>

            <!-- Main Route Grids -->
            <div class="dashboard-grid" style="grid-template-columns: 1.6fr 1fr;">
                
                <!-- Left: Route Map Canvas & Polyline Placeholder -->
                <div style="display:flex; flex-direction:column; gap:24px;">
                    <div class="glass-card" style="padding:24px; position:relative; overflow:hidden;">
                        <div class="flex-between" style="margin-bottom:16px;">
                            <h2 style="font-size:16px; font-weight:700; color:var(--text-main);">Route overview</h2>
                            <span id="routeStatusBadge" class="badge badge-info">Loading…</span>
                        </div>

                        <div style="height:340px; border-radius:var(--border-radius-md); background:var(--bg-app); border:1px solid var(--border-color); position:relative; display:flex; flex-direction:column; justify-content:space-between; padding:20px; overflow:hidden;">

                            <svg style="position:absolute; top:0; left:0; width:100%; height:100%; pointer-events:none;" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                <path d="M 50 280 Q 200 150, 400 200 T 700 80" stroke="#16C15D" stroke-width="5" fill="none" stroke-dasharray="8 6" />
                            </svg>

                            <!-- Endpoints of the corridor this driver is running. -->
                            <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:12px; z-index:2;">
                                <div style="background:var(--bg-card-solid); padding:8px 14px; border-radius:10px; border:1.5px solid #22C55E; box-shadow:var(--shadow-sm); max-width:45%;">
                                    <div style="font-size:10px; font-weight:700; color:#22C55E;">FIRST PICKUP</div>
                                    <strong id="routeFirstStop" style="font-size:13px;">—</strong>
                                </div>
                                <div style="background:var(--bg-card-solid); padding:8px 14px; border-radius:10px; border:1.5px solid #3B82F6; box-shadow:var(--shadow-sm); text-align:right; max-width:45%;">
                                    <div style="font-size:10px; font-weight:700; color:#3B82F6;">NEXT TARGET STOP</div>
                                    <strong id="routeNextStop" style="font-size:13px;">—</strong>
                                </div>
                            </div>

                            <div style="z-index:2; background:rgba(15,23,42,0.85); color:#FFFFFF; padding:12px 18px; border-radius:12px; backdrop-filter:blur(6px); display:flex; align-items:center; justify-content:space-between; gap:16px;">
                                <div>
                                    <div style="font-size:11px; color:rgba(255,255,255,0.7); text-transform:uppercase; font-weight:600;">Trip progress</div>
                                    <div id="routeProgressLabel" style="font-size:13px; font-weight:700; margin-top:2px;">—</div>
                                </div>
                                <div style="width:140px; background:rgba(255,255,255,0.2); height:8px; border-radius:4px; overflow:hidden;" role="progressbar" aria-labelledby="routeProgressLabel" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="routeProgressBar">
                                    <div id="routeProgressFill" style="width:0%; background:#16C15D; height:100%; border-radius:4px; transition:width .3s ease;"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right: Pickup & Drop Stops Sequence.
                     Built by js/routes.js from the trip manifest. This markup
                     previously hardcoded two sample riders, so every driver saw
                     the same two names on every route regardless of who was
                     actually booked. -->
                <div>
                    <div class="glass-card" style="padding:24px;">
                        <div class="flex-between" style="margin-bottom:16px; gap:12px;">
                            <h2 style="font-size:15px; font-weight:700; color:var(--text-main);">Route sequence &amp; stops</h2>
                            <select id="routeTripSelect" class="form-input" style="font-size:11px; padding:4px 8px; max-width:150px; display:none;" aria-label="Choose which trip to view"></select>
                        </div>

                        <div id="routeStopsContainer" style="display:flex; flex-direction:column; gap:14px; position:relative;">
                            <div class="glass-card skeleton-pulse" style="height:76px; border-radius:12px;"></div>
                            <div class="glass-card skeleton-pulse" style="height:76px; border-radius:12px;"></div>
                        </div>
                    </div>
                </div>

            </div>

            <div id="footer-placeholder"></div>
        </div>
    </div>

    <script src="../js/apiBase.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/constants.js"></script>
    <script src="../js/state.js"></script>
    <script src="../js/utils.js"></script>
    
    <script src="../js/api/authApi.js"></script>
    <!-- tripApi supplies the assigned trip this page describes. Without it the
         stop sequence below could only be hardcoded sample riders. -->
    <script src="../js/api/driverApi.js"></script>
    <script src="../js/api/tripApi.js"></script>
    <script src="../js/api/notificationApi.js"></script>
    <script src="../js/common.js"></script>
    <script src="../js/routes.js"></script>

    <script>
        setTimeout(() => lucide.createIcons(), 600);
    </script>
</body>
</html>
