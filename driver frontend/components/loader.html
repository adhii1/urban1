<!-- TORQQ Driver Full-Page Overlay Loader -->
<div id="fullPageLoaderOverlay" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(8, 12, 20, 0.4);
    backdrop-filter: blur(8px);
    z-index: 100000;
    display: none;
    align-items: center;
    justify-content: center;
    transition: opacity 0.3s ease;
">
    <div style="
        background: var(--bg-card-solid, #FFFFFF);
        padding: 32px 48px;
        border-radius: var(--border-radius-lg, 20px);
        box-shadow: var(--shadow-premium);
        border: 1px solid var(--border-color);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
    ">
        <div class="loader-spinner" style="
            width: 48px;
            height: 48px;
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--color-primary, #16C15D);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        "></div>
        <div style="font-weight: 700; color: var(--text-main); font-size: 15px; letter-spacing: 0.5px;">Connecting to API...</div>
        <div style="font-size: 12px; color: var(--text-light);">Please wait a moment</div>
    </div>
</div>
<style>
@keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
}
</style>
