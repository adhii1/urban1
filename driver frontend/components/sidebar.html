<!-- TORQQ Driver Sidebar Component -->
<div class="sidebar glass-card" style="
    width: var(--sidebar-width);
    height: 100vh;
    position: fixed;
    top: 0;
    left: 0;
    z-index: 100;
    display: flex;
    flex-direction: column;
    padding: 24px 16px;
    border-radius: 0 var(--border-radius-lg) var(--border-radius-lg) 0;
    border-left: none;
    border-top: none;
    border-bottom: none;
    transition: var(--transition-smooth);
">
    <!-- Brand Logo -->
    <div class="sidebar-brand" style="
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 32px;
        padding-left: 8px;
    ">
        <span class="logo-icon" style="
            background: #16C15D;
            color: #FFFFFF;
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 20px;
            box-shadow: 0 4px 12px rgba(22, 193, 93, 0.3);
        ">T</span>
        <div>
            <h1 style="font-size: 18px; font-weight: 700; color: var(--text-main); line-height: 1.1;">TORQQ</h1>
            <span style="font-size: 10px; color: var(--text-light); font-weight: 500; letter-spacing: 1px;">DRIVER PANEL</span>
        </div>
    </div>

    <!-- Driver Card Profile Info -->
    <div class="driver-profile-widget" style="
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 16px 12px;
        background: var(--bg-hover);
        border-radius: var(--border-radius-md);
        margin-bottom: 24px;
        border: 1px solid var(--border-color);
        position: relative;
    ">
        <div style="position: relative;">
            <!-- src is set from the signed-in driver's profile; a hardcoded stock
                 portrait here showed the same face to every driver. -->
            <img id="sidebarDriverAvatar" src="" class="avatar" alt="Driver profile photo">
            <span id="sidebarOnlineIndicator" class="online-indicator" style="
                position: absolute;
                bottom: 2px;
                right: 2px;
                width: 12px;
                height: 12px;
                border-radius: 50%;
                background: #EF4444;
                border: 2px solid var(--bg-card-solid);
            "></span>
        </div>
        <div style="flex-grow: 1; min-width: 0;">
            <h2 id="sidebarDriverName" style="font-size: 14px; font-weight: 700; color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-bottom: 2px;">Loading…</h2>
            <div style="display: flex; align-items: center; gap: 4px;">
                <span style="color: #F59E0B; font-size: 12px;">★</span>
                <span id="sidebarDriverRating" style="font-size: 12px; font-weight: 600; color: var(--text-main);">—</span>
                <span id="sidebarDriverVehicle" style="font-size: 11px; color: var(--text-light);"></span>
            </div>
        </div>
    </div>

    <!-- Navigation Menu Items -->
    <nav class="sidebar-menu" style="flex-grow: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; margin-bottom: 16px;" aria-label="Sidebar navigation">
        <a href="dashboard.html" class="menu-link" id="nav-dashboard" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--border-radius-sm); font-size: 14px; font-weight: 500; color: var(--text-light); transition: var(--transition-smooth);">
            <i class="lucide-layout-dashboard" style="font-size: 18px;"></i>
            <span>Dashboard</span>
        </a>
        <a href="my-trips.html" class="menu-link" id="nav-trips" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--border-radius-sm); font-size: 14px; font-weight: 500; color: var(--text-light); transition: var(--transition-smooth);">
            <i class="lucide-route" style="font-size: 18px;"></i>
            <span>My Trips</span>
        </a>
        <a href="passengers.html" class="menu-link" id="nav-passengers" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--border-radius-sm); font-size: 14px; font-weight: 500; color: var(--text-light); transition: var(--transition-smooth);">
            <i class="lucide-users" style="font-size: 18px;"></i>
            <span>Passengers</span>
        </a>
        <a href="routes.html" class="menu-link" id="nav-routes" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--border-radius-sm); font-size: 14px; font-weight: 500; color: var(--text-light); transition: var(--transition-smooth);">
            <i class="lucide-map-pinned" style="font-size: 18px;"></i>
            <span>Routes</span>
        </a>
        <a href="earnings.html" class="menu-link" id="nav-earnings" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--border-radius-sm); font-size: 14px; font-weight: 500; color: var(--text-light); transition: var(--transition-smooth);">
            <i class="lucide-wallet" style="font-size: 18px;"></i>
            <span>Earnings</span>
        </a>
        <a href="payouts.html" class="menu-link" id="nav-payouts" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--border-radius-sm); font-size: 14px; font-weight: 500; color: var(--text-light); transition: var(--transition-smooth);">
            <i class="lucide-arrow-right-left" style="font-size: 18px;"></i>
            <span>Payouts</span>
        </a>
        <a href="analytics.html" class="menu-link" id="nav-analytics" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--border-radius-sm); font-size: 14px; font-weight: 500; color: var(--text-light); transition: var(--transition-smooth);">
            <i class="lucide-trending-up" style="font-size: 18px;"></i>
            <span>Analytics</span>
        </a>
        <a href="notifications.html" class="menu-link" id="nav-notifications" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--border-radius-sm); font-size: 14px; font-weight: 500; color: var(--text-light); transition: var(--transition-smooth); justify-content: space-between;">
            <div style="display: flex; align-items: center; gap: 12px;">
                <i class="lucide-bell" style="font-size: 18px;"></i>
                <span>Notifications</span>
            </div>
            <span id="sidebarNotificationBadge" class="badge badge-danger" style="padding: 2px 6px; font-size: 10px; display: none;">0</span>
        </a>
        <a href="documents.html" class="menu-link" id="nav-documents" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--border-radius-sm); font-size: 14px; font-weight: 500; color: var(--text-light); transition: var(--transition-smooth);">
            <i class="lucide-file-text" style="font-size: 18px;"></i>
            <span>Documents</span>
        </a>
        <a href="vehicle.html" class="menu-link" id="nav-vehicle" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--border-radius-sm); font-size: 14px; font-weight: 500; color: var(--text-light); transition: var(--transition-smooth);">
            <i class="lucide-car" style="font-size: 18px;"></i>
            <span>Vehicle Info</span>
        </a>
        <a href="support.html" class="menu-link" id="nav-support" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--border-radius-sm); font-size: 14px; font-weight: 500; color: var(--text-light); transition: var(--transition-smooth);">
            <i class="lucide-headset" style="font-size: 18px;"></i>
            <span>Support</span>
        </a>
        <a href="settings.html" class="menu-link" id="nav-settings" style="display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-radius: var(--border-radius-sm); font-size: 14px; font-weight: 500; color: var(--text-light); transition: var(--transition-smooth);">
            <i class="lucide-settings" style="font-size: 18px;"></i>
            <span>Settings</span>
        </a>
    </nav>

    <!-- Today's Earnings Widget Quickview -->
    <div class="today-earnings-card" style="
        padding: 16px;
        background: var(--bg-hover);
        border-radius: var(--border-radius-md);
        border: 1px solid var(--border-color);
        margin-bottom: 16px;
    ">
        <span style="font-size: 11px; font-weight: 600; color: var(--text-light); text-transform: uppercase; letter-spacing: 0.5px;">Today's Revenue</span>
        <div id="sidebarTodayEarnings" style="font-size: 20px; font-weight: 700; color: var(--text-main); margin: 4px 0;">₹0.00</div>
        <div style="font-size: 11px; color: var(--text-light);">Trips completed today: <span id="sidebarTodayTrips" style="font-weight: 600; color: var(--color-primary);">0</span></div>
    </div>

    <!-- Go Offline Actions -->
    <div style="border-top: 1px solid var(--border-color); padding-top: 16px;">
        <button id="goOfflineBtn" class="btn btn-danger" style="width: 100%; border-radius: var(--border-radius-md); justify-content: center; gap: 8px;">
            <i class="lucide-power"></i>
            <span>Go Offline</span>
        </button>
    </div>
</div>
