<!-- TORQQ Driver Shared Modal Structure -->
<div id="torqqSharedModal" style="
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background-color: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(6px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
    transition: opacity 0.25s ease;
">
    <div class="modal-dialog glass-card" style="
        width: 100%;
        max-width: 500px;
        background: var(--bg-card-solid);
        border-radius: var(--border-radius-lg);
        box-shadow: var(--shadow-premium);
        transform: scale(0.95);
        transition: transform 0.25s cubic-bezier(0.16, 1, 0.3, 1);
        overflow: hidden;
        display: flex;
        flex-direction: column;
    ">
        <!-- Header -->
        <div style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-color);
        ">
            <h3 id="sharedModalTitle" style="font-size: 16px; font-weight: 700; color: var(--text-main);">Modal Title</h3>
            <button id="sharedModalCloseBtn" aria-label="Close dialog" style="
                background: none;
                border: none;
                cursor: pointer;
                color: var(--text-light);
                font-size: 24px;
                line-height: 1;
            ">&times;</button>
        </div>

        <!-- Body -->
        <div id="sharedModalBody" style="
            padding: 24px;
            overflow-y: auto;
            max-height: 70vh;
            font-size: 14px;
            color: var(--text-main);
        ">
            Modal contents go here...
        </div>

        <!-- Footer / Action Buttons -->
        <div id="sharedModalFooter" style="
            display: flex;
            justify-content: flex-end;
            gap: 12px;
            padding: 16px 24px;
            border-top: 1px solid var(--border-color);
            background: var(--bg-app);
        ">
            <!-- Action buttons loaded dynamically -->
        </div>
    </div>
</div>
